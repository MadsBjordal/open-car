name: Compatibility report
description: Tell us how open-car works (or not) on your head unit or adapter.
labels: [compatibility]
body:
  - type: input
    id: device
    attributes:
      label: Device (maker, model, hardware revision, firmware)
    validations:
      required: true
  - type: input
    id: vehicles
    attributes:
      label: Vehicle(s) it is fitted to (make, model, years)
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options: [On the head unit (Linux), On the head unit (Android), External adapter computer, Could not install]
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: What you tested and what happened
      description: Wired/wireless Android Auto, CarPlay (and its authentication route), audio, mic, calls, touch, knobs, steering-wheel buttons. Phone models and OS versions.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: open-car and LIVI versions
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `opencar check`
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No VIN, serial numbers, phone numbers, MFi keys or firmware files are included.
          required: true
