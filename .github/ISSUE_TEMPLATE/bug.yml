name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: open-car version, LIVI version, device
      placeholder: "opencar 0.1.0, LIVI v10.1.0, Raspberry Pi 5"
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `opencar check`
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed VINs, phone numbers, addresses and other personal data.
          required: true
